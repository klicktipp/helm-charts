# Title: Users from existing secrets (e.g. 1Password)
# Note: since messaging-topology-operator 1.20.0, an existingSecret must carry the label
# rabbitmq.com/topology-operator: "true" - the chart cannot add it for you, so label it yourself.
rabbitmq:
  cluster:
    name: app-rabbitmq
  topology:
    users:
      app-user:
        metadataName: app-user
        existingSecret: rabbitmq-user-app
        permission:
          referenceType: userReference
          metadataName: app-user
          enabled: true
          vhost: "/"
          configure: ".*"
          write: ".*"
          read: ".*"
